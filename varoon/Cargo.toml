[package]
name = "varoon"
version = "1.0.2"
edition = "2024"
description = "XSS parameter reflection scanner written in Rust"
license = "MIT"
authors = ["R0X4R"]
repository = "https://github.com/R0X4R/letsrusty/tree/main/varoon"

[dependencies]
reqwest = { version = "0.12", features = ["rustls-tls"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
url = "2.5"
anyhow = "1.0"
num_cpus = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
